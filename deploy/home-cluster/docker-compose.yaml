## Penpot for a home cluster: Authelia SSO for people, a private path for agents.
##
## Derived from docker/images/docker-compose.yaml. Read HANDOFF.md before
## changing anything here; several values look arbitrary and are not.
##
## Two frontends serve one backend. This is not redundancy -- the frontend bakes
## PENPOT_PUBLIC_URI into js/config.js at startup, and every URL the app dials
## derives from it, including mcp-ws-uri. One value cannot serve both a public
## hostname and a loopback one, so each gets its own nginx.

x-flags-base: &flags-base >-
  enable-smtp
  enable-prepl-server
  enable-mcp
  enable-secure-session-cookies
  enable-login-with-oidc
  enable-oidc-registration
  disable-registration

networks:
  penpot:

volumes:
  penpot_postgres_v15:
  penpot_assets:
  penpot_agent_profile:

services:
  ## ---------------------------------------------------------------- frontends

  # Public: THIS is the service the Cloudflare tunnel connects to. It binds
  # ${PENPOT_BIND} so an ingress on another host can reach it.
  #
  # Anything that can reach this port skips Cloudflare Access, so on a shared
  # LAN the gate is only as good as the network. Set PENPOT_BIND=127.0.0.1 and
  # run cloudflared on this host if you want that closed.
  penpot-frontend-public:
    image: "penpotapp/frontend:${PENPOT_VERSION}"
    restart: always
    ports:
      - "${PENPOT_BIND}:${PENPOT_PUBLIC_PORT}:8080"
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on: [penpot-backend, penpot-exporter, penpot-mcp]
    networks: [penpot]
    environment:
      # disable-login-with-password hides the password form. This is COSMETIC:
      # the backend still accepts passwords (the agent account needs that), and
      # frontend flags only drive the UI. Cloudflare Access is the real gate.
      PENPOT_FLAGS: !!str >-
        ${PENPOT_FLAGS_BASE}
        disable-login-with-password
      PENPOT_PUBLIC_URI: "https://${PENPOT_HOST}"
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "${PENPOT_MAX_BODY}"
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: "${PENPOT_MAX_BODY}"

  # Agent path: no Cloudflare anywhere in it. OIDC is hidden here (its
  # redirect_uri points at the public host and cannot come back here) and the
  # password form is shown, because the agent logs in with a password.
  #
  # PENPOT_LOCAL_URI must be an origin the agent's BROWSER considers
  # trustworthy, because session cookies carry Secure once hardened. localhost
  # qualifies over plain http; a LAN hostname does not. An agent on another
  # machine therefore SSH-forwards this port and still calls it localhost.
  penpot-frontend-local:
    image: "penpotapp/frontend:${PENPOT_VERSION}"
    restart: always
    ports:
      - "${PENPOT_BIND}:${PENPOT_LOCAL_PORT}:8080"
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on: [penpot-backend, penpot-exporter, penpot-mcp]
    networks: [penpot]
    environment:
      PENPOT_FLAGS: !!str >-
        ${PENPOT_FLAGS_BASE}
        disable-login-with-oidc
        enable-login-with-password
      PENPOT_PUBLIC_URI: "${PENPOT_LOCAL_URI}"
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "${PENPOT_MAX_BODY}"
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: "${PENPOT_MAX_BODY}"

  ## ------------------------------------------------------------------ backend

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION}"
    restart: always
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      penpot-postgres: {condition: service_healthy}
      penpot-valkey: {condition: service_healthy}
    networks: [penpot]
    environment:
      # The backend enforces auth; it keeps login-with-password enabled (default)
      # so the agent account can log in non-interactively.
      PENPOT_FLAGS: "${PENPOT_FLAGS_BASE}"
      # Emails and the OIDC redirect_uri are built from this, so it is the
      # PUBLIC host even though one frontend is loopback.
      PENPOT_PUBLIC_URI: "https://${PENPOT_HOST}"
      PENPOT_SECRET_KEY: "${PENPOT_SECRET_KEY}"
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: "${PENPOT_MAX_BODY}"
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: "${PENPOT_MAX_BODY}"

      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      PENPOT_REDIS_URI: redis://penpot-valkey/0

      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets

      PENPOT_TELEMETRY_ENABLED: "false"

      ## ---- Authelia OIDC.
      ## Endpoints are set explicitly rather than autodiscovered: the browser
      ## and this container reach Authelia over different paths, and
      ## autodiscovery can only return one hostname. Values below were read from
      ## https://id.ihate.work/.well-known/openid-configuration on 2026-09-18.
      PENPOT_OIDC_CLIENT_ID: "${PENPOT_OIDC_CLIENT_ID}"
      PENPOT_OIDC_CLIENT_SECRET: "${PENPOT_OIDC_CLIENT_SECRET}"
      PENPOT_OIDC_BASE_URI: "${AUTHELIA_PUBLIC_URI}/"
      # Browser-facing.
      PENPOT_OIDC_AUTH_URI: "${AUTHELIA_PUBLIC_URI}/api/oidc/authorization"
      # Server-to-server. Point these at whatever this container can resolve;
      # they may be identical to the public host if there is no internal route.
      PENPOT_OIDC_TOKEN_URI: "${AUTHELIA_INTERNAL_URI}/api/oidc/token"
      PENPOT_OIDC_USER_URI: "${AUTHELIA_INTERNAL_URI}/api/oidc/userinfo"
      PENPOT_OIDC_JWKS_URI: "${AUTHELIA_INTERNAL_URI}/jwks.json"
      # Without this the backend refuses to call the provider at all.
      PENPOT_SSRF_ALLOWED_HOSTS: "${PENPOT_SSRF_ALLOWED_HOSTS}"
      # Optional: restrict who may log in, by Authelia group.
      # PENPOT_OIDC_ROLES_ATTR: groups
      # PENPOT_OIDC_ROLES: "penpot"

      ## ---- Mail. Defaults to the local catcher; no mail leaves the host.
      ## Replace with a real relay if you want password resets to work.
      PENPOT_SMTP_DEFAULT_FROM: "${PENPOT_SMTP_FROM}"
      PENPOT_SMTP_DEFAULT_REPLY_TO: "${PENPOT_SMTP_FROM}"
      PENPOT_SMTP_HOST: penpot-mailcatch
      PENPOT_SMTP_PORT: 1025
      PENPOT_SMTP_TLS: "false"
      PENPOT_SMTP_SSL: "false"

  ## ----------------------------------------------------------------- services

  penpot-mcp:
    image: "penpotapp/mcp:${PENPOT_VERSION}"
    restart: always
    networks: [penpot]

  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION}"
    restart: always
    depends_on:
      penpot-valkey: {condition: service_healthy}
    networks: [penpot]
    environment:
      PENPOT_FLAGS: "${PENPOT_FLAGS_BASE}"
      PENPOT_SECRET_KEY: "${PENPOT_SECRET_KEY}"
      PENPOT_PUBLIC_URI: "https://${PENPOT_HOST}"
      # Internal only; the exporter renders through the public frontend's nginx.
      PENPOT_INTERNAL_URI: http://penpot-frontend-public:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0

  penpot-postgres:
    image: "postgres:15"
    restart: always
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 2s
      timeout: 10s
      retries: 5
      start_period: 2s
    volumes:
      - penpot_postgres_v15:/var/lib/postgresql/data
    networks: [penpot]
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  penpot-valkey:
    image: valkey/valkey:8.1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks: [penpot]
    environment:
      - VALKEY_EXTRA_FLAGS=--maxmemory 128mb --maxmemory-policy volatile-lfu

  ## Mail catcher. Its web UI shows EVERY message the instance sends, including
  ## password-reset links, so whoever opens it can take over any account. It has
  ## its own bind address, defaulting to loopback, and should keep it. Never
  ## route it through the tunnel.
  penpot-mailcatch:
    image: sj26/mailcatcher:latest
    restart: always
    expose: ['1025']
    ports:
      - "${PENPOT_MAILCATCH_BIND}:${PENPOT_MAILCATCH_PORT}:1080"
    networks: [penpot]

  ## The headless MCP agent, inert unless started with `--profile agent`.
  ##
  ## A stock Playwright image with this repo mounted -- no build. Its tag must
  ## match the playwright version in mcp/packages/host/package.json, because the
  ## mounted node_modules supplies the client and the image supplies the
  ## browsers.
  ##
  ## network_mode: host is not laziness. Hardened session cookies are Secure, so
  ## the browser only keeps them for a trustworthy origin; localhost qualifies
  ## and a container hostname like penpot-frontend-local does not. Sharing the
  ## host's network namespace lets the agent say localhost and mean it. It is
  ## therefore NOT on the penpot network and reaches Penpot through the
  ## published port, so PENPOT_BIND must stay reachable on loopback.
  penpot-agent:
    image: "mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION}-noble"
    restart: always
    profiles: [agent]
    network_mode: host
    working_dir: /repo/mcp/packages/host
    env_file: [agent/agent.env]
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Inside the container the profile lives on the named volume below, not
      # in the operator's home directory.
      PENPOT_PROFILE_DIR: /profile
    volumes:
      - "${PENPOT_SRC:-../..}:/repo:ro"
      - penpot_agent_profile:/profile
    # Log in if the stored session is gone, then hold the file open.
    command: >-
      bash -lc "node spikes/login.js && node host.js"

  ## Optional tunnel, inert unless started with `--profile tunnel`. Reaches the
  ## public frontend over the compose network, so PENPOT_BIND can stay closed
  ## when this is used. Create the tunnel in Cloudflare first and put its token
  ## in CLOUDFLARED_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    profiles: [tunnel]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN:-}
    depends_on: [penpot-frontend-public]
    networks: [penpot]
